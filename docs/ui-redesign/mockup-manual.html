<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>手动控制 · 九宫格方案</title>
<style>
  :root{
    --bg:#F3F5F9; --surface:#FFF; --surface-2:#F8FAFC; --surface-3:#EEF2F7;
    --line:#E4E8EF; --line-strong:#D3DAE4;
    --text:#121A26; --text-2:#57657A; --text-3:#8B97A8;
    --brand:#1B6AC9; --brand-dark:#1557A8; --brand-soft:#EAF2FD;
    --ok:#0F7B3D; --ok-soft:#E6F4EB;
    --warn:#A85B00; --warn-soft:#FDF1E0;
    --danger:#D0342C; --danger-soft:#FCEAE8;
    --font:"Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:28px;background:var(--bg);font-family:var(--font);font-size:13px;color:var(--text)}
  .card{width:1010px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .card-h h2{margin:0;font-size:14px;font-weight:600}
  .muted{color:var(--text-3);font-size:12px}
  .chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;border:1px solid #CDE8D8;background:var(--ok-soft);color:var(--ok)}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
  .body{padding:16px 18px 18px}
  .top{display:flex;align-items:flex-end;gap:18px;margin-bottom:14px}
  .seg{display:inline-flex;background:var(--surface-3);border-radius:8px;padding:2px;gap:2px}
  .seg span{display:inline-flex;align-items:center;height:28px;padding:0 16px;border-radius:6px;color:var(--text-2);font-size:12.5px;cursor:pointer}
  .seg span.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.06)}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:11px;color:var(--text-3)}
  .input{height:32px;border:1px solid var(--line-strong);border-radius:6px;padding:0 9px;display:flex;align-items:center;font-family:var(--mono);font-size:13px;background:#fff}
  .input .unit{color:var(--text-3);font-size:11px;margin-left:auto;padding-left:6px}
  .speeds{display:flex;gap:10px;margin-left:auto;align-items:flex-end}
  .speeds .field{width:92px}

  .pad-wrap{display:flex;gap:26px;align-items:flex-start}
  .pad{display:grid;grid-template-columns:repeat(3,116px);grid-auto-rows:74px;gap:10px}
  .key{background:#fff;border:1px solid var(--line-strong);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;user-select:none}
  .key:hover{border-color:#C2CBD8;background:var(--surface-2)}
  .key .ar{font-size:22px;line-height:1}
  .key .lb{font-size:11px;color:var(--text-3)}
  .key .nm{font-size:12px;color:var(--text-2)}
  .key.stop{border-color:#EFC9C5;color:var(--danger);background:#FFF9F8}
  .key.stop .ar{font-size:18px}
  .key.dis{opacity:.38;pointer-events:none}
  .key.zr .ar{font-size:16px}

  .side{flex:1;min-width:0}
  .coords{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .coord{display:flex;align-items:baseline;justify-content:space-between}
  .coord .k{font-size:11.5px;color:var(--text-3)}
  .coord .v{font-family:var(--mono);font-size:16px;font-weight:600}

  .row-block{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  #absBlock{display:none}
  .row-line{display:flex;align-items:flex-end;gap:10px}
  .row-line .field{width:150px}
  .btn{height:32px;padding:0 14px;border-radius:6px;border:1px solid var(--line-strong);background:#fff;font:inherit;font-size:12.5px;cursor:pointer}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .row-title{font-size:12.5px;font-weight:600;margin:0 0 8px}
  .hint{font-size:11.5px;color:var(--text-3);margin-top:10px}
  .warn{color:var(--warn)}
  .disabled{opacity:.45;pointer-events:none}
</style>
</head>
<body>
<div class="card">
  <div class="card-h">
    <h2>手动控制</h2>
    <span class="muted">轴 0/1/2/3 = X/Y/Z/R</span>
    <span style="flex:1"></span>
    <span class="chip"><span class="dot"></span>X 轴 · 已使能</span>
  </div>

  <div class="body">
    <div class="top">
      <div class="seg" id="modes">
        <span class="on" data-m="step">步进</span><span data-m="cont">连续</span><span data-m="abs">绝对</span>
      </div>
      <div class="field">
        <label>步长</label>
        <div class="input" style="width:118px">1.0000<span class="unit">mm / °</span></div>
      </div>
      <div class="speeds">
        <div class="field"><label>XY 速度</label><div class="input">20.0</div></div>
        <div class="field"><label>Z 速度</label><div class="input">2.0</div></div>
        <div class="field"><label>R 速度</label><div class="input">5.0</div></div>
      </div>
    </div>

    <div class="pad-wrap">
      <div class="pad" id="pad">
        <div class="key zr"><span class="ar">↺</span><span class="nm">R 逆时针</span><span class="lb">R−</span></div>
        <div class="key"><span class="ar">↑</span><span class="nm">Y 正向</span><span class="lb">Y+</span></div>
        <div class="key zr"><span class="ar">⤒</span><span class="nm">Z 上升</span><span class="lb">Z+</span></div>

        <div class="key"><span class="ar">←</span><span class="nm">X 负向</span><span class="lb">X−</span></div>
        <div class="key stop"><span class="ar">■</span><span class="nm">停止全部</span><span class="lb">X/Y/Z/R</span></div>
        <div class="key"><span class="ar">→</span><span class="nm">X 正向</span><span class="lb">X+</span></div>

        <div class="key zr"><span class="ar">↻</span><span class="nm">R 顺时针</span><span class="lb">R+</span></div>
        <div class="key"><span class="ar">↓</span><span class="nm">Y 负向</span><span class="lb">Y−</span></div>
        <div class="key zr"><span class="ar">⤓</span><span class="nm">Z 下降</span><span class="lb">Z−</span></div>
      </div>

      <div class="side">
        <div class="coords">
          <div class="coord"><span class="k">X 位置</span><span class="v">12.3456</span></div>
          <div class="coord"><span class="k">Y 位置</span><span class="v">-48.0021</span></div>
          <div class="coord"><span class="k">Z 位置</span><span class="v">0.0000</span></div>
          <div class="coord"><span class="k">R 位置</span><span class="v">90.0000</span></div>
        </div>

        <div class="row-block" id="absBlock">
          <p class="row-title">绝对位置（X/Y 一起走）</p>
          <div class="row-line">
            <div class="field"><label>X</label><div class="input">12.3456</div></div>
            <div class="field"><label>Y</label><div class="input">-48.0021</div></div>
            <button class="btn">取当前</button>
            <button class="btn primary">移动到</button>
          </div>
        </div>

        <div class="row-block">
          <p class="row-title">单轴定位 · 当前选中 X 轴</p>
          <div class="row-line">
            <div class="field"><label>目标位置</label><div class="input">12.3456</div></div>
            <button class="btn">取当前</button>
            <button class="btn primary">移动</button>
          </div>
        </div>
      </div>
    </div>

    <div class="hint" id="hint">步进模式：点一下走一个步长；按住不重复触发。想连续走切“连续”，想精确到点切“绝对”。</div>
  </div>
</div>

<script>
  const mode = location.hash === '#abs' ? 'abs' : (location.hash === '#cont' ? 'cont' : 'step');
  const pad = document.getElementById('pad');
  const absBlock = document.getElementById('absBlock');
  const hint = document.getElementById('hint');
  document.querySelectorAll('#modes span').forEach(s => s.classList.toggle('on', s.dataset.m === mode));
  if (mode === 'abs') {
    pad.classList.add('disabled');
    absBlock.style.display = 'block';
    hint.textContent = '绝对模式：九宫格已禁用；填 X/Y 点“移动到”两轴一起走；单轴定位跟随上方选中的轴。';
  } else if (mode === 'cont') {
    hint.textContent = '连续模式：按住方向键移动，松开立即停止；松开/移出/切页都会停。';
  } else {
    hint.textContent = '步进模式：点一下走一个步长；想连续走切“连续”，想精确到点切“绝对”。';
  }
</script>
</body>
</html>
